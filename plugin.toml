# Globs see the program basename plus its args after Tern strips `npx` and its
# options, `VAR=` prefixes, `command` and directories, so no `npx` forms are
# needed. The lens re-derives the command from argv and shows raw output for
# anything it cannot render. `scripts/tern-netsuite-wrappers` fills the marked
# region from the config's `lens.wrappers`; it ships empty.
[[lenses]]
id = "suitecloud"
match = [
	"suitecloud project:validate",
	"suitecloud project:validate *",
	"suitecloud project:deploy",
	"suitecloud project:deploy *",
	"suitecloud file:upload",
	"suitecloud file:upload *",
	"suitecloud project:package",
	"suitecloud project:package *",
	"suitecloud project:adddependencies",
	"suitecloud project:adddependencies *",
	"suitecloud account:manageauth *",
	"suitecloud object:list",
	"suitecloud object:list *",
	"suitecloud file:list",
	"suitecloud file:list *",
	"suitecloud-cli *",
	"suitecloud-cli@* *",
	# BEGIN tern-netsuite wrappers
	# END tern-netsuite wrappers
]
