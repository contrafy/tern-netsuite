description = "NetSuite for Tern: native SuiteCloud SDF CLI views (validate, deploy, auth), a production deploy guard and account status, plus read-only SuiteQL, execution logs and account health."
icon = "cloud"
host = "plugin/host.luau"
window = "plugin/window.luau"
styles = []

[[blocks]]
id = "doctor"
title = "NetSuite Doctor"
icon = "cloud"

[[blocks]]
